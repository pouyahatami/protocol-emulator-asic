# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator" # Project title
  author:       "Pouya Hatami" # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A firmware-programmable engine for deterministic hardware protocols" # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Initial target; update if implementation results require it

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Competition allocation

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pouyahatami_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "unused_input_0"
  ui[1]: "unused_input_1"
  ui[2]: "unused_input_2"
  ui[3]: "unused_input_3"
  ui[4]: "unused_input_4"
  ui[5]: "unused_input_5"
  ui[6]: "unused_input_6"
  ui[7]: "unused_input_7"

  # Outputs
  uo[0]: "unused_output_0"
  uo[1]: "unused_output_1"
  uo[2]: "unused_output_2"
  uo[3]: "unused_output_3"
  uo[4]: "unused_output_4"
  uo[5]: "unused_output_5"
  uo[6]: "unused_output_6"
  uo[7]: "unused_output_7"

  # Bidirectional pins
  uio[0]: "unused_bidir_0"
  uio[1]: "unused_bidir_1"
  uio[2]: "unused_bidir_2"
  uio[3]: "unused_bidir_3"
  uio[4]: "unused_bidir_4"
  uio[5]: "unused_bidir_5"
  uio[6]: "unused_bidir_6"
  uio[7]: "unused_bidir_7"

# Do not change!
yaml_version: 6
