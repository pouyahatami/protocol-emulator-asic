# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator" # Project title
  author:       "Pouya Hatami" # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A firmware-programmable engine for deterministic hardware protocols" # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Initial target; update if implementation results require it

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Competition allocation

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pouyahatami_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "imem_addr[0]"
  ui[1]: "imem_addr[1]"
  ui[2]: "imem_addr[2]"
  ui[3]: "imem_addr[3]"
  ui[4]: "imem_addr[4]"
  ui[5]: "imem_addr[5]"
  ui[6]: "imem_select"
  ui[7]: "imem_write"

  # Outputs
  uo[0]: "imem_read_byte[0]"
  uo[1]: "imem_read_byte[1]"
  uo[2]: "imem_read_byte[2]"
  uo[3]: "imem_read_byte[3]"
  uo[4]: "imem_read_byte[4]"
  uo[5]: "imem_read_byte[5]"
  uo[6]: "imem_read_byte[6]"
  uo[7]: "imem_read_byte[7]"

  # Bidirectional pins
  uio[0]: "imem_write_data[0] / read byte select (input only)"
  uio[1]: "imem_write_data[1] (input only)"
  uio[2]: "imem_write_data[2] (input only)"
  uio[3]: "imem_write_data[3] (input only)"
  uio[4]: "imem_write_data[4] (input only)"
  uio[5]: "imem_write_data[5] (input only)"
  uio[6]: "imem_write_data[6] (input only)"
  uio[7]: "imem_write_data[7] (input only)"

# Do not change!
yaml_version: 6
